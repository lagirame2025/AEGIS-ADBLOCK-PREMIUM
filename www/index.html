<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div><h1>Buku Cha Tea Solo 2026 <span id="rl" class="badge"></span></h1><div class="sub">Sunter Alamanda Raya &middot; <span id="st"></span></div></div><span id="rfw"></span></div>

const RATE=()=>S&&S.rate!=null?S.rate:250;

const pd=s=>new Date(s+"T00:00"),addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};

const DM=[["m1","Original (Es Teh Manis)",5000,"",1,"B"],["m2","Jeruk Peras Besar",12000,"jeruk",2,"B"],["m3","Jeruk Peras Kecil",8000,"jeruk",1,"K"],["m4","Jeruk Nipis",8000,"nipis",1,"B"],["m5","Lemon",10000,"lemon",.5,"B"],["m6","Milo",10000,"milo",1,"B"],["m8","SKM",10000,"skm",.5,"B"],["m9","Ovaltine",10000,"ovaltine",1,"B"],["m10","Original (Gratis)",0,"",1,"K"]];

 if(!S||!S.menus)S={menus:DM.map(a=>({id:a[0],n:a[1],p:a[2],s:a[3],u:a[4],c:a[5]})),stocks:[["jeruk","Jeruk"],["nipis","Jeruk Nipis"],["lemon","Lemon"],["milo","Milo"],["ovaltine","Ovaltine"],["skm","SKM"]],days:{}}}

 for(const t of d.tx){const v=t.q*t.p,q=t.pay=="qris";o.om+=v;if(q)o.qr+=v;if(t.c!="T")o.cup+=t.q;o[t.c]+=t.q;if(/gratis/i.test(t.n))o.bon+=t.q;
  const b=o.by[t.n]||(o.by[t.n]={q:0,o:0,qr:0});b.q+=t.q;b.o+=v;if(q)b.qr+=v;
  if(t.s)o.use[t.s]=(o.use[t.s]||0)+t.q*t.u}
 o.pk=N(d.makan)+N(d.gaji)+(d.kx||[]).reduce((a,e)=>a+N(e.a),0);o.po=d.exp.reduce((a,e)=>a+N(e.a),0);o.pe=o.pk+o.po;o.tu=o.om-o.qr;o.rate=d.rate!=null?d.rate:RATE();o.gb=d.gm!=null?N(d.gm):o.B;o.kb=d.libur?0:o.gb*o.rate;o.net=o.tu-o.pe-o.kb;return o}

 D().tx.push({id:"t"+Date.now()+Math.random().toString(36).slice(2,6),m:m.id,n:m.n,p:m.p,q:qty,pay,c:tum?"T":m.c,s:m.s,u:m.u,t:t.toTimeString().slice(0,5)});qty=1;tum=0;save();render()}
function del(id){if(ROLE=="karyawan")return;const d=D();d.tx=d.tx.filter(t=>t.id!=id);(d.txdel=d.txdel||[]).push(id);save();render()}
function carry(){const ks=Object.keys(S.days).filter(k=>k<cur&&S.days[k].tx.length).sort();if(!ks.length){MSG="Belum ada data hari sebelumnya.";return render()}

   const kmod=new Map((x.txmod||[]).filter(i=>!msent.has(i)).map(id=>(x.tx||[]).find(t=>t.id==id)).filter(Boolean).map(t=>[t.id,t])),ndel=new Set((x.txdel||[]).filter(i=>!dsent.has(i)));
   x.tx=((r.E&&r.E.tx)||[]).filter(t=>!ndel.has(t.id)).map(t=>kmod.get(t.id)||t).concat((x.tx||[]).filter(t=>!sent.has(t.id)));x.txdel=(x.txdel||[]).filter(i=>!dsent.has(i));x.txmod=(x.txmod||[]).filter(i=>!msent.has(i));if(b.E.ex&&x.ex_t===b.E.exv)x.ex_t=0;FV++;
   if(ROLE=="pemilik")S.eh[dt]=ehash(x);if(S.dirty[dt]===v)delete S.dirty[dt];save(1)}
  status("Tersinkron "+tm())}
 catch(e){bad=true;status("Belum terkirim, dicoba lagi otomatis")}
 FL=false;const again=FQ||Object.keys(S.dirty).length>0;FQ=false;if(again&&!bad)setTimeout(flush,250)}
let PEND=0;
const hsh=s=>{let x=0;for(let i=0;i<s.length;i++)x=(x*31+s.charCodeAt(i))|0;return x};
const typing=()=>{const a=document.activeElement;return !!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName||""))};
const esig=()=>{const d=S.days[ymd(new Date())];return hsh(JSON.stringify([S.menus,S.stocks,S.rate,S.gh,d?ehash(d):0,S.reqs||0]))};
const osig=()=>hsh(JSON.stringify([S.days,S.menus,S.stocks,S.rate,OQ]));
async function empSync(quiet){if(!syncOn())return;await flush();
 try{if(!quiet)status("Memperbarui...");const a=esig(),dt=ymd(new Date()),v0=FV,r=await api({action:"pullEmp",day:dt});
  if(r.cfg){if(r.cfg.menus)S.menus=r.cfg.menus;if(r.cfg.stocks)S.stocks=r.cfg.stocks;if(r.cfg.rate!=null)S.rate=r.cfg.rate;if(r.cfg.gh!=null)S.gh=r.cfg.gh}
  if(r.reqs){S.reqs=S.reqs||{};r.reqs.forEach(q=>{S.reqs[q.rid]=q});Object.keys(S.reqs).forEach(k=>{const q=S.reqs[k];if(q.day!=dt&&ACT.indexOf(q.st)<0)delete S.reqs[k]})}
  if(r.E&&FV===v0)mergeEmpDay(dt,r.E);
  const ch=a!==esig();save(1);status("Tersinkron "+tm());if(!quiet)MSG="Data diperbarui.";
  if(!quiet||(ch&&!typing()))render();else if(ch)PEND=1}
 catch(e){status("Gagal memperbarui, coba lagi nanti");if(!quiet){MSG="Gagal terhubung. Periksa URL, kunci, dan internet.";render()}}}
async function refreshAll(quiet){if(RB)return;
 if(!syncOn()){if(!quiet){MSG="Belum terhubung ke Google Sheets. Isi URL dan Kunci Owner di Pengaturan (atau di config.js) lalu pakai APK.";render()}return}
 RB=true;rfBtn();const a0=osig();
 try{await flush();status("Mengambil data karyawan...");const v0=FV,j=await api({action:"pullAll"}),days=j.days||{};
  if(FV!==v0){RB=false;rfBtn();setTimeout(()=>refreshAll(true),300);return}
  OQ=j.reqs||OQ;
  if(j.cfg&&!Object.keys(S.days).length&&!S.cfgv){if(j.cfg.menus)S.menus=j.cfg.menus;if(j.cfg.stocks)S.stocks=j.cfg.stocks;if(j.cfg.sup)S.sup=j.cfg.sup;if(j.cfg.cover)S.cover=j.cfg.cover;if(j.cfg.rate!=null)S.rate=j.cfg.rate;if(j.cfg.gh!=null)S.gh=j.cfg.gh;S.cfgv=1}
  Object.keys(days).forEach(dt=>{const s=days[dt];delete s.del;const L=S.days[dt]||{},dd=!!S.dirty[dt],keep=(L.tx||[]).filter(t=>dd&&!(s.tx||[]).some(x=>x.id==t.id)),n2=Object.assign(blank(),L,s);
   const mods=new Map((L.txmod||[]).map(id=>(L.tx||[]).find(t=>t.id==id)).filter(Boolean).map(t=>[t.id,t]));n2.tx=s.tx===undefined?(L.tx||[]):(s.tx.filter(t=>!(L.txdel||[]).includes(t.id)).map(t=>mods.get(t.id)||t).concat(keep));if(L.ex_t){n2.exp=L.exp;n2.kx=L.kx}if(dd)OWN.forEach(f=>{if(L[f]!==undefined)n2[f]=L[f]});
   S.days[dt]=n2;if(S.eh[dt]!==ehash(n2))S.dirty[dt]=++DVER});
  save(1);status("Menyinkronkan ke Google Sheets...");await flush();RPT=null;await pushShop();status("Diperbarui "+tm());
  if(!quiet)MSG="Refresh selesai. Data karyawan sudah masuk ke aplikasi dan Google Sheets."}
 catch(e){status("Gagal refresh");if(!quiet)MSG="Refresh gagal. Periksa internet, URL, dan kunci."}
 RB=false;const ch=a0!==osig();if(!quiet||(ch&&!typing()))render();else{rfBtn();if(ch)PEND=1}}
function rfBtn(){const w=$("#rfw");if(w){const n=OQ.filter(q=>q.st=="pending"||q.st=="approved").length;w.innerHTML=ROLE=="pemilik"?`${n?`<button class="b x" onclick="tab='catat';render()">&#128276; ${n}</button> `:""}<button class="b p rf${RB?" busy":""}" onclick="refreshAll()" ${RB?"disabled":""}><span class="ic">&#x21bb;</span> Refresh</button>`:""}const r=$("#rl");if(r)r.textContent=ROLE=="karyawan"?"Karyawan":"Owner"}
var SYNC_OK=null,BKT="";
async function testSync(){try{await api({action:"ping"});SYNC_OK=true;MSG="Terhubung ke Google Sheets. Langkah 1 selesai."}catch(e){SYNC_OK=false;MSG="Gagal terhubung: periksa URL, kunci, dan internet."}render()}
function sendAll(){if(!syncOn()){MSG="Belum terhubung ke Google Sheets. Isi URL dan Kunci Owner, lalu Uji koneksi dulu.";return render()}Object.keys(S.days).forEach(k=>S.dirty[k]=++DVER);MSG="Mengirim semua data...";flush();render()}
function rbAsk(){const t=($('#bk').value||'').trim();try{const o=JSON.parse(t);if(!o.menus||!o.days)throw 0}catch(e){BKT='';CF='';MSG='Format cadangan tidak valid. Tidak ada data yang diubah.';return render()}
 if(CF!='pl'){BKT=t;CF='pl';return render()}
 const o=JSON.parse(t);o.pw=S.pw;S=o;BKT='';CF='';save();MSG='Data dipulihkan.';render()}
function vSync(){const y=S.sync,ok=SYNC_OK===true?'<span class="badge ok">&#10003; Terhubung</span>':SYNC_OK===false?'<span class="badge no">Gagal</span>':'<span class="badge gry">Belum diuji</span>',sa=CF=="sa";return `<div class="cd"><h2>Koneksi Google Sheets</h2><div class="sub">Karyawan mengirim catatan otomatis. Tekan tombol Refresh di bagian atas untuk menarik semua data karyawan ke aplikasi ini dan ke Google Sheets. URL dan kunci juga bisa diisi di file config.js sebelum APK dibuat.</div>
<div class="nt warn">&#9888; Ikuti urutan 1 &rarr; 2 &rarr; 3 di bawah. Kunci OWNER jangan diberikan ke karyawan. Salah URL/kunci tidak merusak data, tetapi data tidak akan terkirim.</div>
<div style="margin-top:8px"><label>URL Web App (Apps Script)</label><input value="${esc(y.url)}" onchange="S.sync.url=this.value.trim();SYNC_OK=null;save(1)"></div>
<div style="margin-top:8px"><label>Kunci OWNER (dari Code.gs, jangan diberikan ke karyawan)</label><input type="password" value="${esc(y.okey||"")}" onchange="S.sync.okey=this.value.trim();SYNC_OK=null;save(1)"></div>
<div class="sy">
<div class="stp"><div class="sn"><b>1</b>Uji koneksi ${ok}</div><button class="b p" onclick="testSync()">Uji koneksi</button><div class="nt">AMAN. Hanya mengecek apakah URL dan kunci benar. Tidak mengubah data apa pun. Lakukan setiap kali mengisi atau mengganti URL/kunci.</div></div>
<div class="stp"><div class="sn"><b>2</b>Kirim data HP &rarr; Sheets</div><button class="b${sa?" x":""}" onclick="cfm('sa',()=>sendAll())">${sa?"Yakin kirim semua?":"Kirim semua data lokal"}</button>${sa?`<button class="b" style="margin-top:6px" onclick="CF='';render()">Batal</button>`:""}<div class="nt dng">HATI-HATI. Memaksa SEMUA tanggal di HP ini dikirim ulang dan bisa mengubah data di Google Sheets agar mengikuti HP ini. Pakai hanya saat pertama kali menyambungkan, atau bila HP ini yang datanya paling lengkap. Jangan dipakai di HP yang baru dipasang/kosong. Biasanya tidak perlu, karena data sudah terkirim otomatis.</div></div>
<div class="stp"><div class="sn"><b>3</b>Refresh Sheets &rarr; HP</div><button class="b" onclick="refreshAll()">Refresh sekarang</button><div class="nt">AMAN untuk dipakai harian. Mengambil catatan terbaru karyawan ke aplikasi ini, sekaligus mengirim perubahan yang tertunda. Perubahan lokal yang belum terkirim tidak ditimpa. Butuh internet.</div></div>
</div></div>`}
function vSetupEmp(){return `<div class="cd"><h2>Sambungkan ke toko</h2><div class="sub" style="margin-bottom:8px">Isi sekali saja. Minta URL dan kunci kepada pemilik.</div><div class="nt warn">&#9888; Pastikan URL dan kunci benar sebelum menekan Simpan. Jangan bagikan kunci ke orang lain. Jika salah, catatan tidak akan masuk ke toko.</div><label>URL Web App</label><input id="su" placeholder="https://script.google.com/..." value="${esc(S.sync.url)}"><label style="margin-top:8px">Kunci</label><input id="sk" type="password" value="${esc(S.sync.key)}"><button class="b p" style="margin-top:10px;width:100%" onclick="S.sync.url=$('#su').value.trim();S.sync.key=$('#sk').value.trim();save(1);empSync()">Simpan &amp; sambungkan</button><div class="nt">Setelah tersambung, catatan terkirim otomatis. Tidak perlu menekan tombol lain.</div></div>`}
setInterval(()=>{if(!syncOn()||document.hidden)return;ROLE=="pemilik"?refreshAll(true):empSync(true)},ROLE=="pemilik"?60000:15000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&syncOn())ROLE=="pemilik"?refreshAll(true):empSync(true)});
setInterval(()=>{if(syncOn()&&!document.hidden&&ROLE=="pemilik")orSync()},20000);
document.addEventListener("focusout",()=>{if(PEND){PEND=0;setTimeout(render,200)}});
window.addEventListener("online",()=>{RL="";if(syncOn())ROLE=="pemilik"?refreshAll(true):empSync(true)});
load();ensure();render();
if(syncOn())setTimeout(()=>ROLE=="pemilik"?refreshAll(true):empSync(true),400);
</script></body></html>
