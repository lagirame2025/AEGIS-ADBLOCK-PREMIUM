version: 2
updates:
  # Versi action di workflow: PR otomatis tiap minggu (build akan menguji PR-nya).
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  # Dependensi Gradle (AGP/Kotlin/AndroidX): dibatasi agar PR tidak menumpuk.
  - package-ecosystem: gradle
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
