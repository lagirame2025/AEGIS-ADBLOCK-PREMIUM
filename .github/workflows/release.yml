name: Release APK
# Rilis: git tag v1.6 && git push origin v1.6  -> APK terbit di halaman Releases.
on:
  push:
    tags: ['v*']
permissions: {contents: write}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Tag harus cocok dengan versionName
        run: |
          want="v$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" app/build.gradle | head -1)"
          if [ "$want" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME tidak cocok dengan versionName di app/build.gradle (diharapkan $want)"; exit 1
          fi
      - name: Cek cepat
        run: |
          node --check app/src/main/assets/scriptlets.js
          python3 -m unittest discover -s pipeline -v
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v6
        with: {gradle-version: "8.7", cache-provider: basic}
      # Rilis publik wajib memakai kunci tetap, kalau tidak pengguna tidak bisa memperbarui dari rilis ke rilis.
      - name: Keystore tetap (wajib untuk rilis)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KS" ] || { echo "::error::Secret DEBUG_KEYSTORE_BASE64 belum diisi (lihat README)"; exit 1; }
          mkdir -p ~/.android
          echo "$KS" | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey >/dev/null \
            || { echo "::error::DEBUG_KEYSTORE_BASE64 tidak valid"; exit 1; }
      - run: gradle :app:assembleDebug --stacktrace
      - name: Terbitkan rilis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          mkdir -p dist && cp "$apk" "dist/aegis-adblock-$GITHUB_REF_NAME.apk"
          sha256sum "dist/aegis-adblock-$GITHUB_REF_NAME.apk" | tee "dist/SHA256SUMS.txt"
          gh release create "$GITHUB_REF_NAME" "dist/aegis-adblock-$GITHUB_REF_NAME.apk" dist/SHA256SUMS.txt \
            --title "Aegis AdBlock $GITHUB_REF_NAME" --generate-notes
