name: Update blocklist
on:
  schedule: [{cron: "0 */6 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 pipeline/build_blocklist.py
      - run: |
          git config user.name "blocklist-bot"; git config user.email "bot@users.noreply.github.com"
          git add blocklist.txt cosmetic.txt; git diff --cached --quiet || (git commit -m "Update blocklist" && git push)
