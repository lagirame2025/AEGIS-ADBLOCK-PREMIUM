name: Build Desktop (Windows installer + ekstensi)
on:
  workflow_dispatch:
  push:
    paths: ['desktop/**']
    tags: ['desktop-v*']
concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with: { go-version: '1.22' }
      - uses: actions/setup-node@v6
        with: { node-version: '22' }
      - run: ./desktop/build.sh "$PWD/out"
      - uses: actions/upload-artifact@v7
        with:
          name: aegis-desktop
          path: |
            out/AegisSetup.exe
            out/aegis.exe
            out/ext-*.zip
            out/SHA256SUMS.txt
