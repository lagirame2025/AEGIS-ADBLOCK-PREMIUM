name: Health check blocklist
# Memastikan alamat unduhan yang dipakai aplikasi (BASE_URL di Updater.kt) benar-benar berfungsi
# dan isinya sehat. Bila rusak, otomatis membuka satu Issue (tanpa duplikat) supaya langsung ketahuan.
on:
  workflow_run:
    workflows: ["Update blocklist"]
    types: [completed]
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: health-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Periksa alamat, ukuran, dan bentuk isi
        id: chk
        run: |
          set -u
          problems=""
          want="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/"
          have=$(grep -oE 'https://raw\.githubusercontent\.com/[^"]+' app/src/main/java/com/aegis/adblock/Updater.kt | head -1)
          # Nama repo tidak peka huruf besar/kecil di GitHub, jadi bandingkan tanpa memperhatikannya.
          if [ "${have,,}" != "${want,,}" ]; then
            problems="${problems}- BASE_URL di Updater.kt (${have}) tidak sama dengan repo ini (${want}).\n"
          fi
          for f in blocklist.txt cosmetic.txt; do
            code=$(curl -sS -o "/tmp/$f" -w '%{http_code}' --max-time 60 "${want}${f}" || echo "000")
            if [ "$code" != "200" ]; then
              problems="${problems}- ${f}: HTTP ${code} (repo harus publik & file harus ada).\n"
            fi
          done
          if [ -s /tmp/blocklist.txt ]; then
            size=$(stat -c %s /tmp/blocklist.txt)
            ratio=$(python3 - <<'PY'
          import re
          rx = re.compile(r"[a-z0-9]([a-z0-9.-]*[a-z0-9])?\.[a-z0-9-]{2,}")
          lines = [l.strip() for l in open("/tmp/blocklist.txt", errors="ignore") if l.strip() and not l.startswith("#")]
          good = sum(1 for l in lines if rx.fullmatch(l))
          print(f"{len(lines)} {good * 100 // max(len(lines), 1)}")
          PY
          )
            n=${ratio% *}; pct=${ratio#* }
            echo "blocklist.txt: ${size} byte, ${n} baris, ${pct}% berbentuk domain"
            if [ "$size" -lt 1000 ] || [ "$pct" -lt 90 ]; then
              problems="${problems}- blocklist.txt tampak rusak (${size} byte, ${pct}% domain). Aplikasi akan menolaknya.\n"
            fi
          fi
          if [ -n "$problems" ]; then
            printf '%b' "$problems" > /tmp/problems.txt
            echo "ok=false" >> "$GITHUB_OUTPUT"
            cat /tmp/problems.txt
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "Semua sehat."
          fi
      - name: Buka Issue bila ada masalah (tanpa duplikat)
        if: steps.chk.outputs.ok == 'false'
        run: |
          title="Health check blocklist gagal"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number' || true)
          body="$(cat /tmp/problems.txt)

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
      - name: Gagalkan run bila tidak sehat
        if: steps.chk.outputs.ok == 'false'
        run: exit 1
