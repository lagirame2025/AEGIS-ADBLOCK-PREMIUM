version: 2
updates:
  # Versi action di workflow: satu PR gabungan per minggu (build akan menguji PR-nya).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Dependensi Gradle (AGP/Kotlin/AndroidX). Lonjakan MAJOR (mis. AGP 8 -> 9, Gradle 8 -> 9) butuh migrasi
  # manual dan uji di HP, jadi tidak diajukan otomatis. Update minor/patch digabung jadi satu PR.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      gradle-minor-patch:
        update-types: ["minor", "patch"]
