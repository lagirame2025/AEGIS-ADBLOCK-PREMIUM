#!/usr/sbin/nft -f
# Rate limit koneksi baru ke port DoT (853) per alamat sumber.
#
# Kenapa hook "prerouting", bukan "input": port yang dipublikasikan Docker di-DNAT, sehingga paketnya
# lewat jalur forward dan TIDAK pernah menyentuh chain input. Prerouting dilihat kedua jalur.
#
# Batasan: DoT tidak punya autentikasi klien, dan IP seluler berganti-ganti, jadi allowlist IP tidak praktis.
# Ini hanya meredam penyalahgunaan/banjir; bukan pengganti kontrol akses.
#
# Uji sintaks dulu (tanpa menerapkan):  nft -c -f nftables-dot.conf
# Terapkan:                              nft -f nftables-dot.conf
# Hapus:                                 nft delete table inet aegis_dot
# Agar permanen, sertakan berkas ini dari /etc/nftables.conf.

table inet aegis_dot {
    chain prerouting {
        type filter hook prerouting priority -300; policy accept;

        # Koneksi TCP baru ke 853: maks. ~20/detik per IP (burst 40). Satu klien Aegis normal membuka
        # sedikit koneksi karena koneksi hangat dipakai ulang.
        tcp dport 853 ct state new meter dot_flood { ip saddr timeout 1m limit rate over 20/second burst 40 packets } counter drop
        tcp dport 853 ct state new meter dot_flood6 { ip6 saddr timeout 1m limit rate over 20/second burst 40 packets } counter drop
    }
}
